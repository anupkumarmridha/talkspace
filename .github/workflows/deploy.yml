# Continuous integration and deployment.
#
# Every push and pull request is typechecked and run against the server-side
# test suites on a local Worker (miniflare). A push to main that passes is
# deployed to Cloudflare with Wrangler.
#
# The browser suites (mesh, resilience, TURN) need a real Chrome with fake
# media devices and are run locally with `npm test`; they are not part of CI.
#
# Secrets required on the repository:
#   CLOUDFLARE_API_TOKEN   an API token created from the "Edit Cloudflare
#                          Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account id shown on the Workers overview page

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # One deploy at a time; a newer push cancels an older run still in progress.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Start a local Worker
        run: |
          npx wrangler dev --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8787/; then exit 0; fi
            sleep 1
          done
          echo "local Worker did not start"; cat wrangler.log; exit 1

      - name: Server-side suites
        run: |
          npm run test:api
          npm run test:security
          npm run test:crypto
          npm run test:host
          npm run test:knock
          ABANDONED_PORT=8791 npm run test:abandoned

      - name: Worker log
        if: failure()
        run: cat wrangler.log

  deploy:
    name: Deploy to Cloudflare
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Wrangler's "Authentication error [code: 10000]" says nothing about
      # *why*. Ask Cloudflare directly first, so a bad token or a mismatched
      # account id is named in plain words. Secrets are masked in the log.
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          echo "token length: ${#CLOUDFLARE_API_TOKEN}  account id length: ${#CLOUDFLARE_ACCOUNT_ID}"
          verify=$(curl -s https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "token verify: $(echo "$verify" | jq -c '{success, status: .result.status, errors}')"
          echo "$verify" | jq -e '.success == true and .result.status == "active"' > /dev/null \
            || { echo "::error::The API token is not valid. Create one with the 'Edit Cloudflare Workers' template and re-run 'gh secret set CLOUDFLARE_API_TOKEN'."; exit 1; }

          accounts=$(curl -s "https://api.cloudflare.com/client/v4/accounts?per_page=50" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          echo "accounts visible to token: $(echo "$accounts" | jq -c '{success, count: (.result | length), names: [.result[].name], errors}')"
          echo "$accounts" | jq -e --arg id "$CLOUDFLARE_ACCOUNT_ID" '.result[] | select(.id == $id)' > /dev/null \
            || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not an account this token can see. Copy the Account ID from the Workers & Pages overview (not a Zone ID) and re-run 'gh secret set CLOUDFLARE_ACCOUNT_ID'."; exit 1; }
          echo "credentials look good"

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
